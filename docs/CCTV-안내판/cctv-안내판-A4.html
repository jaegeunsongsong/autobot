  :root{ --cream:#F5EFE6; --berry:#6D2E46; --gold:#B98A44; }
  @page{size:210mm 297mm;margin:0}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#ddd6cc}
  @media print{html,body{background:var(--cream)}}

  .sheet{
    width:210mm;height:297mm;margin:0 auto;background:var(--cream);color:var(--berry);
    position:relative;overflow:hidden;
    font-family:"Gowun Dodum Sign","Gowun Dodum",sans-serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  @media screen{.sheet{box-shadow:0 10px 40px rgba(0,0,0,.18);margin:24px auto}}

  /* 얇은 골드 테두리: 바깥 0.5mm + 안쪽 0.2mm 2중선 */
  .frame{position:absolute;inset:9mm;border:0.5mm solid var(--gold);border-radius:4mm;pointer-events:none}
  .frame::after{content:"";position:absolute;inset:1.6mm;border:0.2mm solid var(--gold);border-radius:3mm;opacity:.75}

  .content{
    position:absolute;inset:0;padding:30mm 20mm 20mm;
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }

  .icon{width:54mm;height:auto;display:block;margin:0 auto 10mm}

  h1{
    font-family:"Jua Sign","Jua",sans-serif;font-weight:400;
    font-size:26mm;line-height:1.1;letter-spacing:0.4mm;margin:0;white-space:nowrap;
  }
  .rule{display:flex;align-items:center;gap:4mm;width:58%;margin:8mm auto 10mm}
  .rule::before,.rule::after{content:"";flex:1;height:0.3mm;background:var(--gold)}
  .rule i{width:2.4mm;height:2.4mm;background:var(--gold);border-radius:50%;display:block}

  .row{margin:0 0 10mm;white-space:nowrap}
  .k{font-size:6.2mm;line-height:1.3;color:var(--gold);letter-spacing:0.4mm;margin-bottom:1mm}
  .v{font-size:9.4mm;line-height:1.3;font-weight:700}
  .num{font-variant-numeric:tabular-nums;letter-spacing:0.2mm}

  .brand{
    font-family:"Nunito Sign","Nunito",sans-serif;font-weight:600;
    font-size:5mm;letter-spacing:1.1mm;color:var(--gold);margin-top:auto;padding-top:8mm;
  }
</style>
</head>
